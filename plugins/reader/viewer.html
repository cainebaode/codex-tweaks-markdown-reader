<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Markdown 阅读器</title>
  <style>
    :root { color-scheme: light dark; }
    :root[data-theme="light"] { color-scheme: light; }
    :root[data-theme="dark"] { color-scheme: dark; }
    body {
      margin: 0;
      color: var(--color-text-primary, CanvasText);
      font: 400 15px/1.65 system-ui, sans-serif;
    }
    main { box-sizing: border-box; max-width: 75rem; margin-inline: auto; padding: 1rem clamp(.75rem, 2vw, 1.75rem) 3rem; }
    article { overflow-wrap: anywhere; }
    p, ul, ol, dl, blockquote { margin-block: .65em; }
    article > :is(p, ul, ol, blockquote) { max-width: 58em; }
    h1, h2, h3, h4, h5, h6 { margin-block: 1.25em .4em; line-height: 1.32; }
    h1:first-child { margin-block-start: 0; }
    h1 { font-size: 1.85em; }
    h2 { font-size: 1.4em; }
    h3 { font-size: 1.15em; }
    strong { font-weight: 750; }
    li > p { margin-block: .25em; }
    blockquote { padding-inline-start: .85em; border-inline-start: 3px solid color-mix(in srgb, currentColor 24%, transparent); }
    pre, code { font: .9em/1.5 ui-monospace, SFMono-Regular, Consolas, monospace; }
    pre { overflow: auto; padding: .75em 1em; border-radius: .3em; background: color-mix(in srgb, currentColor 6%, transparent); }
    pre code { font-size: 1em; }
    a[href] { color: var(--color-text-link, LinkText); text-underline-offset: .15em; }
    a:not([href]), .image-caption { font-style: italic; }
    .table-scroll { overflow-x: auto; margin-block: .85em; }
    table { border-collapse: collapse; width: auto; max-width: 100%; }
    th, td {
      min-width: 1.4em;
      max-width: 36em;
      padding: .45em clamp(.35em, 1.2vw, .8em);
      border: 1px solid color-mix(in srgb, currentColor 21%, transparent);
      vertical-align: top;
      overflow-wrap: anywhere;
    }
    th { background: color-mix(in srgb, currentColor 7%, transparent); text-align: start; }
    tbody tr:nth-child(even) { background: color-mix(in srgb, currentColor 2.5%, transparent); }
  </style>
</head>
<body>
  <main>
    <p id="status" role="status">正在打开文件…</p>
    <article aria-label="Markdown 正文"></article>
  </main>
  <script type="module">/* SCRIPT */</script>
</body>
</html>
